function shape(n,a,s,c,extra){var p='',R=100,N=180;for(var i=0;i<=N;i++){var t=i/N*2*Math.PI,r=R*(1-a+a*Math.cos(n*t));p+=(i?'L':'M')+(r*Math.cos(t)).toFixed(1)+' '+(r*Math.sin(t)).toFixed(1)}
return '<svg viewBox="-105 -105 210 210" width="'+s+'" height="'+s+'" style="'+(extra||'')+'" aria-hidden="true"><path d="'+p+'Z" fill="'+c+'"/></svg>'}
