<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replica – SMM Kingdom Tasks Automation</title>
<meta name="description" content="Replica automates Instagram tasks for the SMM Kingdom Tasks Bot on your Android device.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&display=swap" rel="stylesheet">
<style>
@property --h {
  syntax: '<number>';
  inherits: true;
  initial-value: 155;
}
:root {
  --h: 155;
  transition: --h 0.8s cubic-bezier(0.2, 0, 0, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --emph: cubic-bezier(0.2, 0, 0, 1);
  --p: oklch(0.5 0.15 var(--h));
  --onp: oklch(0.99 0.01 var(--h));
  --pc: oklch(0.91 0.07 var(--h));
  --onpc: oklch(0.26 0.08 var(--h));
  --tc: oklch(0.9 0.07 calc(var(--h) + 110));
  --ontc: oklch(0.28 0.07 calc(var(--h) + 110));
  --bg: oklch(0.985 0.007 var(--h));
  --s1: oklch(0.965 0.014 var(--h));
  --s2: oklch(0.945 0.02 var(--h));
  --s3: oklch(0.92 0.026 var(--h));
  --tx: oklch(0.22 0.02 var(--h));
  --mut: oklch(0.46 0.03 var(--h));
  --ol: oklch(0.88 0.025 var(--h));
}
:root[data-mode="dark"] {
  --p: oklch(0.8 0.13 var(--h));
  --onp: oklch(0.25 0.08 var(--h));
  --pc: oklch(0.38 0.09 var(--h));
  --onpc: oklch(0.92 0.05 var(--h));
  --tc: oklch(0.4 0.08 calc(var(--h) + 110));
  --ontc: oklch(0.93 0.06 calc(var(--h) + 110));
  --bg: oklch(0.17 0.015 var(--h));
  --s1: oklch(0.22 0.02 var(--h));
  --s2: oklch(0.27 0.025 var(--h));
  --s3: oklch(0.32 0.03 var(--h));
  --tx: oklch(0.93 0.015 var(--h));
  --mut: oklch(0.75 0.03 var(--h));
  --ol: oklch(0.35 0.03 var(--h));
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 140px; color-scheme: light dark; }
body {
  font-family: 'Roboto Flex', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--bg);
  color: var(--tx);
  line-height: 1.55;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: var(--p); font-weight: 550; text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; }
.w { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 20px; }
:focus-visible { outline: 3px solid var(--p); outline-offset: 3px; }

/* ripple effect */
.rip { position: relative; overflow: hidden; isolation: isolate; }
.rp {
  position: absolute;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.2;
  transform: scale(0);
  animation: rp 0.65s var(--emph) forwards;
  pointer-events: none;
}
@keyframes rp { to { transform: scale(1); opacity: 0; } }

/* header bar */
header { position: sticky; top: 12px; z-index: 50; padding: 0 10px; }
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 8px 12px 8px 18px;
  border-radius: 32px;
  background: color-mix(in oklch, var(--s2) 84%, transparent);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid color-mix(in oklch, var(--ol) 65%, transparent);
  box-shadow: 0 8px 24px -6px oklch(0 0 0 / 0.08);
}
.logo {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.02em;
  color: var(--tx);
  text-decoration: none;
}
.logo svg { animation: spin 24s linear infinite; }
.ctl { display: flex; align-items: center; gap: 8px; position: relative; }

nav {
  flex: 0 0 100%;
  order: 3;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  position: relative;
  padding: 4px;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav a {
  position: relative;
  z-index: 1;
  white-space: nowrap;
  color: var(--mut);
  font-size: 14px;
  font-weight: 550;
  padding: 8px 16px;
  border-radius: 99px;
  transition: color 0.25s ease;
}
nav a:hover { color: var(--tx); text-decoration: none; }
nav a.on { color: var(--onpc); }

.ind {
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 0;
  width: 0;
  border-radius: 99px;
  pointer-events: none;
  transition: transform 0.45s var(--spring), width 0.45s var(--spring), opacity 0.2s ease;
}
nav .ind { background: var(--pc); }

.seg {
  display: flex;
  position: relative;
  background: var(--s3);
  border-radius: 99px;
  padding: 3px;
}
.seg button {
  position: relative;
  z-index: 1;
  border: 0;
  background: none;
  color: var(--mut);
  font-size: 12px;
  font-weight: 650;
  padding: 7px 11px;
  border-radius: 99px;
  cursor: pointer;
  transition: color 0.25s ease;
}
.seg button.on { color: var(--onp); }
.seg .ind { background: var(--p); top: 3px; bottom: 3px; }

.ib {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: var(--s3);
  color: var(--tx);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: border-radius 0.35s var(--spring), transform 0.25s var(--spring), background 0.25s;
}
.ib svg { width: 20px; height: 20px; }
.ib:hover { border-radius: 14px; }
.ib:active { transform: scale(0.92); }
.ib[aria-expanded="true"] { background: var(--pc); color: var(--onpc); border-radius: 14px; }

.menu {
  position: absolute;
  top: 52px;
  right: 0;
  width: 250px;
  background: var(--s1);
  border: 1px solid var(--ol);
  border-radius: 26px;
  padding: 18px;
  box-shadow: 0 20px 48px -12px oklch(0 0 0 / 0.28);
  transform-origin: top right;
  transform: scale(0.85) translateY(-8px);
  opacity: 0;
  visibility: hidden;
  transition: transform 0.35s var(--spring), opacity 0.2s ease, visibility 0s 0.35s;
  z-index: 60;
}
.menu.open {
  transform: none;
  opacity: 1;
  visibility: visible;
  transition: transform 0.35s var(--spring), opacity 0.2s ease, visibility 0s;
}
.menu small {
  display: block;
  color: var(--mut);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.pal { display: flex; gap: 8px; margin: 10px 0 16px; padding: 2px; }
.pal button {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 0;
  cursor: pointer;
  transition: border-radius 0.3s var(--spring), transform 0.3s var(--spring);
}
.pal button:hover { transform: scale(1.1); }
.pal button[aria-pressed="true"] {
  border-radius: 12px;
  transform: scale(1.12);
  outline: 3px solid var(--tx);
  outline-offset: 2px;
}
.sr { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 15px; }
.sw2 {
  width: 52px;
  height: 32px;
  border-radius: 99px;
  border: 2px solid var(--mut);
  background: var(--s3);
  position: relative;
  cursor: pointer;
  transition: background 0.3s ease, border-color 0.3s ease;
}
.sw2 i {
  position: absolute;
  top: 50%;
  left: 5px;
  width: 18px;
  height: 18px;
  margin-top: -9px;
  border-radius: 50%;
  background: var(--mut);
  transition: transform 0.4s var(--spring), width 0.3s var(--spring), height 0.3s var(--spring), margin 0.3s var(--spring), background 0.3s;
}
.sw2[aria-checked="true"] { background: var(--p); border-color: var(--p); }
.sw2[aria-checked="true"] i {
  width: 22px;
  height: 22px;
  margin-top: -11px;
  background: var(--onp);
  transform: translateX(18px);
}

/* hero */
.hero { display: grid; gap: 32px; align-items: center; padding: 48px 0 16px; }
h1 { font-size: clamp(40px, 9vw, 84px); line-height: 1.04; letter-spacing: -0.045em; font-weight: 800; max-width: 13ch; }
.wd { display: inline-block; animation: rise 0.8s var(--spring) both; }
.wd.hl { color: var(--p); }
@keyframes rise { from { opacity: 0; transform: translateY(0.5em) scale(0.92); } }
.hero p { font-size: clamp(16px, 2.2vw, 19px); color: var(--mut); max-width: 44ch; margin: 20px 0 28px; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.chip { padding: 8px 14px; border-radius: 12px; background: var(--s2); font-size: 13.5px; font-weight: 550; color: var(--mut); }
.tile {
  position: relative;
  width: min(100%, 340px);
  aspect-ratio: 1;
  margin: 0 auto;
  border: 0;
  background: none;
  cursor: pointer;
  display: grid;
  place-items: center;
  -webkit-tap-highlight-color: transparent;
}
.tile svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tile .g {
  position: relative;
  font-size: clamp(88px, 22vw, 140px);
  font-weight: 800;
  color: var(--p);
  letter-spacing: -0.06em;
  line-height: 1;
  pointer-events: none;
  user-select: none;
}
.tile.pop { animation: pop 0.6s var(--spring); }
@keyframes pop { 0% { transform: scale(0.85) rotate(-6deg); } 100% { transform: scale(1) rotate(0deg); } }
@media (min-width: 840px) {
  .hero { grid-template-columns: 1.25fr 0.75fr; padding: 72px 0 24px; }
}

/* buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 48px;
  padding: 0 24px;
  border: 0;
  border-radius: 99px;
  font: 600 15px 'Roboto Flex', sans-serif;
  letter-spacing: 0.01em;
  text-decoration: none;
  cursor: pointer;
  transition: border-radius 0.35s var(--spring), transform 0.25s var(--spring), background 0.25s;
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: currentColor;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.btn:hover { border-radius: 16px; text-decoration: none; }
.btn:hover::after { opacity: 0.08; }
.btn:active { border-radius: 12px; transform: scale(0.96); }
.btn.f { background: var(--p); color: var(--onp); }
.btn.t { background: var(--pc); color: var(--onpc); }
.btn.xl { height: 56px; padding: 0 30px; font-size: 16.5px; }
.btn svg { width: 19px; height: 19px; flex: none; transition: transform 0.4s var(--spring); }
.ac.open .btn svg { transform: rotate(180deg); }

/* sections */
section { padding-top: 80px; }
.sh { margin-bottom: 24px; }
h2 { font-size: clamp(28px, 5vw, 44px); line-height: 1.1; letter-spacing: -0.035em; font-weight: 700; }
.lead { color: var(--mut); margin-top: 8px; max-width: 52ch; font-size: 16.5px; }
.rv { opacity: 0; }
.rv.in { opacity: 1; animation: up 0.75s var(--spring) var(--d, 0s) backwards; }
@keyframes up { from { opacity: 0; transform: translateY(30px) scale(0.97); } }

/* steps */
.steps { display: grid; gap: 14px; }
.step {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 18px;
  background: var(--s1);
  border-radius: 32px;
  padding: 22px 24px;
  transition: border-radius 0.45s var(--spring), background 0.3s;
}
.step:hover { border-radius: 32px 14px 32px 14px; background: var(--s2); }
.num {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--pc);
  color: var(--onpc);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 22px;
  transition: border-radius 0.45s var(--spring), transform 0.45s var(--spring);
}
.step:hover .num { border-radius: 16px; transform: rotate(-8deg) scale(1.05); }
.step h3 { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.25; }
.step p { color: var(--mut); margin-top: 4px; max-width: 56ch; }
.sa { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.step .bd { padding: 14px 4px 2px; }

.vid {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  aspect-ratio: 16/9;
  margin-top: 18px;
  border: 0;
  border-radius: 26px;
  overflow: hidden;
  background: linear-gradient(135deg, var(--pc), var(--tc));
  color: var(--onpc);
  cursor: pointer;
  transition: border-radius 0.45s var(--spring);
}
.vid:hover { border-radius: 26px 12px 26px 12px; }
.play {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--p);
  color: var(--onp);
  display: grid;
  place-items: center;
  transition: border-radius 0.4s var(--spring), transform 0.4s var(--spring);
}
.play svg { width: 32px; height: 32px; }
.vid:hover .play { border-radius: 22px; transform: scale(1.08); }
.vid:active .play { transform: scale(0.95); }
.vid .vs {
  position: absolute;
  left: 14px;
  bottom: 14px;
  padding: 6px 14px;
  border-radius: 10px;
  background: var(--bg);
  color: var(--tx);
  font-size: 13px;
  font-weight: 600;
}
.vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
@media (max-width: 520px) {
  .step { padding: 18px; gap: 14px; }
  .num { width: 42px; height: 42px; font-size: 18px; }
}

/* accordions */
.xw { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s var(--emph); }
.ac.open > .xw, .ac.open .xw { grid-template-rows: 1fr; }
.xi { overflow: hidden; min-height: 0; }
.bd {
  color: var(--mut);
  font-size: 15px;
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 0.25s ease, transform 0.35s var(--spring);
}
.ac.open > .xw > .xi > .bd, .ac.open > .bd { opacity: 1; transform: none; transition-delay: 0.05s; }
.bd ol, .bd ul { padding-left: 20px; }
.bd li { margin: 6px 0; }
.bd b { color: var(--tx); font-weight: 600; }
.bd p { margin-top: 10px; }

.chev {
  flex: none;
  position: relative;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--pc);
  transition: transform 0.45s var(--spring), border-radius 0.35s var(--spring);
}
.chev::before, .chev::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 2.2px;
  margin: -1.1px 0 0 -6px;
  border-radius: 2px;
  background: var(--onpc);
}
.chev::after { transform: rotate(90deg); }
.ac.open > .ach .chev, .ac.open > .ith .chev { transform: rotate(135deg); border-radius: 10px; }

.ach {
  display: flex;
  flex: 1;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: none;
  border: 0;
  color: inherit;
  font: inherit;
  text-align: left;
  padding: 10px 8px 10px 6px;
  border-radius: 20px;
  cursor: pointer;
}
.ach:not(.st):hover { background: color-mix(in oklch, var(--mut) 8%, transparent); }
.ach.st { cursor: default; }

/* checklist */
.panel { background: var(--s1); border-radius: 36px; padding: 22px 14px 14px; }
.prog { padding: 0 12px 14px; }
.prog b { font-size: 16px; font-weight: 650; }
.wavy { display: block; width: 100%; height: 16px; margin-top: 10px; overflow: visible; }
.wavy * { vector-effect: non-scaling-stroke; }
.wave { animation: wv 1.2s linear infinite; }
@keyframes wv { to { transform: translateX(20px); } }
#clr { transition: width 0.75s var(--spring); }

.it { border-radius: 24px; transition: background 0.3s, border-radius 0.4s var(--spring); margin-bottom: 4px; }
.it.open { background: var(--s2); }
.ith { display: flex; align-items: center; gap: 8px; padding: 6px 8px; }
.tt b { display: block; font-weight: 600; font-size: 16px; transition: opacity 0.3s; }
.tt small { display: block; color: var(--mut); font-size: 13.5px; font-weight: 400; }
.it.done .tt b { opacity: 0.6; text-decoration: line-through; }
.it .bd { padding: 0 20px 18px 58px; }

.chk {
  position: relative;
  flex: none;
  width: 28px;
  height: 28px;
  border: 2px solid var(--mut);
  border-radius: 9px;
  background: transparent;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: border-radius 0.4s var(--spring), background 0.25s, border-color 0.25s, transform 0.3s var(--spring);
}
.chk:hover { transform: scale(1.1); }
.chk svg { width: 18px; height: 18px; fill: none; stroke: var(--onp); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chk path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 0.35s var(--emph) 0.05s; }
.chk[aria-checked="true"] { background: var(--p); border-color: var(--p); border-radius: 50%; }
.chk[aria-checked="true"] path { stroke-dashoffset: 0; }
@media (max-width: 520px) {
  .it .bd { padding-left: 20px; }
}

/* tabs */
.tabs { display: inline-flex; position: relative; background: var(--s2); border-radius: 99px; padding: 4px; margin-bottom: 12px; }
.tabs button {
  position: relative;
  z-index: 1;
  border: 0;
  background: none;
  color: var(--mut);
  font-size: 14.5px;
  font-weight: 650;
  padding: 10px 20px;
  border-radius: 99px;
  cursor: pointer;
  transition: color 0.25s;
}
.tabs button.on { color: var(--onp); }
.tabs .ind { background: var(--p); }
.tp { background: var(--s1); border-radius: 32px; padding: 26px; min-height: 160px; }
.tp.swp { animation: swap 0.5s var(--spring); }
@keyframes swap { from { opacity: 0; transform: translateX(20px) scale(0.98); } }
.tp p { font-size: clamp(16.5px, 2.2vw, 19px); line-height: 1.5; max-width: 44ch; }
.tp b { color: var(--p); font-weight: 650; }
.mock { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.mk {
  padding: 11px 18px;
  border-radius: 99px;
  font-weight: 700;
  letter-spacing: 0.04em;
  font-size: 13px;
  background: var(--pc);
  color: var(--onpc);
  transition: transform 0.35s var(--spring), border-radius 0.35s var(--spring);
  user-select: none;
}
.mk.f { background: var(--p); color: var(--onp); }
.mk.t { background: var(--tc); color: var(--ontc); }
.mk:hover { transform: scale(1.05); border-radius: 14px; }

/* pricing */
.price {
  position: relative;
  overflow: hidden;
  background: var(--p);
  color: var(--onp);
  border-radius: 40px 40px 14px 40px;
  padding: 36px 30px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  align-items: center;
  justify-content: space-between;
}
.dec { position: absolute; right: -70px; top: -90px; opacity: 0.14; pointer-events: none; animation: spin 40s linear infinite; }
.price > div:not(.dec), .price > a { position: relative; z-index: 2; }
.amt { font-size: clamp(64px, 16vw, 110px); font-weight: 800; line-height: 0.95; letter-spacing: -0.06em; }
.price small { display: block; font-size: 15.5px; opacity: 0.88; margin-top: 6px; }
.price .btn { background: var(--bg); color: var(--tx); }
.multi {
  margin-top: 12px;
  background: var(--tc);
  color: var(--ontc);
  border-radius: 14px 40px 40px 40px;
  padding: 24px 28px;
  display: flex;
  flex-wrap: wrap;
  gap: 16px 20px;
  align-items: center;
  justify-content: space-between;
}
.multi h3 { font-size: 18.5px; font-weight: 650; letter-spacing: -0.01em; }
.multi p { opacity: 0.88; font-size: 15px; max-width: 44ch; margin-top: 2px; }
.multi .btn { background: var(--ontc); color: var(--tc); }

/* faq */
.fq .ac { background: var(--s1); border-radius: 24px; margin-bottom: 8px; transition: background 0.3s, border-radius 0.4s var(--spring); }
.fq .ac.open { background: var(--s2); }
.fq .ach { width: 100%; padding: 16px 18px 16px 22px; font-weight: 600; font-size: 16px; }
.fq .bd { padding: 0 22px 18px; }

footer { margin-top: 80px; padding: 28px 0 56px; border-top: 1px solid var(--ol); color: var(--mut); font-size: 14px; }

/* fab & toast */
.fab {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 40;
  width: 52px;
  height: 52px;
  border: 0;
  border-radius: 26px;
  background: var(--pc);
  color: var(--onpc);
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: 0 10px 28px -6px oklch(0 0 0 / 0.3);
  transform: scale(0) rotate(-90deg);
  transition: transform 0.45s var(--spring), border-radius 0.35s var(--spring);
}
.fab svg { width: 22px; height: 22px; }
.fab.show { transform: none; }
.fab.show:hover { border-radius: 16px; }
.fab.show:active { transform: scale(0.92); }

.snk {

function shape(n, a, s, c) {
  let p = '', R = 100, N = 160;
  for (let i = 0; i <= N; i++) {
    let t = i / N * Math.PI * 2, r = R * (1 - a + a * Math.cos(n * t));
    p += (i ? 'L' : 'M') + (r * Math.cos(t)).toFixed(1) + ' ' + (r * Math.sin(t)).toFixed(1);
  }
  return `<svg viewBox="-105 -105 210 210" width="${s}" height="${s}" aria-hidden="true"><path d="${p}Z" fill="${c}"/></svg>`;
}

/* sliding indicators */
function mi(c) {
  if (!c) return;
  const i = c.querySelector('.ind');
  const a = c.querySelector('.on');
  if (!i) return;
  if (!a) { i.style.opacity = '0'; return; }
  const first = !c.classList.contains('rdy');
  if (first) i.style.transition = 'none';
  i.style.opacity = '1';
  i.style.width = a.offsetWidth + 'px';
  i.style.transform = `translateX(${a.offsetLeft}px)`;
  if (first) {
    void i.offsetWidth;
    i.style.transition = '';
    c.classList.add('rdy');
  }
}

/* intersection observers */
const rio = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('in');
      rio.unobserve(e.target);
    }
  });
}, { threshold: 0.08 });

function reveal() {
  $$('.rv:not(.in)').forEach(e => {
    const i = Array.prototype.indexOf.call(e.parentNode.children, e);
    e.style.setProperty('--d', Math.min(i, 6) * 60 + 'ms');
    rio.observe(e);
  });
}

const sp = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      cur = IDS.indexOf(e.target.id);
      navOn();
    }
  });
}, { rootMargin: '-30% 0px -60% 0px' });
IDS.forEach(id => { const el = $('#' + id); if (el) sp.observe(el); });

const hs = new IntersectionObserver(es => {
  if (es[0].isIntersecting && cur !== -1) {
    cur = -1;
    navOn();
  }
}, { rootMargin: '0px 0px -60% 0px' });
hs.observe($('.hero'));

/* color & mode */
function setH(h) {
  hue = +h;
  document.documentElement.style.setProperty('--h', h);
  ls('rh', h);
  $$('#pal button').forEach(b => b.setAttribute('aria-pressed', b.dataset.h == h));
}

function setM(m) {
  document.documentElement.dataset.mode = m;
  ls('rm', m);
  $('#dm').setAttribute('aria-checked', m === 'dark');
}

function vt(fn, x, y) {
  if (!document.startViewTransition || reduce) { fn(); return; }
  const t = document.startViewTransition(fn);
  t.ready.then(() => {
    const r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    document.documentElement.animate(
      { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] },
      { duration: 650, easing: 'cubic-bezier(.2,0,0,1)', pseudoElement: '::view-transition-new(root)' }
    );
  }).catch(() => {});
}

/* ripples */
document.addEventListener('pointerdown', e => {
  const r = e.target.closest('.rip');
  if (!r) return;
  const b = r.getBoundingClientRect();
  const s = Math.max(b.width, b.height) * 2;
  const sp = document.createElement('span');
  sp.className = 'rp';
  sp.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - b.left - s / 2}px;top:${e.clientY - b.top - s / 2}px`;
  r.appendChild(sp);
  setTimeout(() => sp.remove(), 700);
});

    tb = +tab.dataset.tab;

/* animated hero tile */
(() => {
  const path = $('#blob'), svg = $('#hsv'), gl = $('#glyph'), tile = $('#tile');
  const S = [[8, 0.07], [6, 0.17], [12, 0.05], [5, 0.14], [10, 0.07], [7, 0.12]];
  const N = 120;

  function d(time) {
    const pos = time / 3.4;
    const i = Math.floor(pos);
    const f = pos - i;
    let k = Math.max(0, Math.min(1, (f - 0.5) / 0.5));
    k = k * k * (3 - 2 * k);

    const A = S[i % S.length];
    const B = S[(i + 1) % S.length];
    let s = '';

    for (let j = 0; j <= N; j++) {
      const a = (j / N) * Math.PI * 2;
      const r = 100 * ((1 - A[1] + A[1] * Math.cos(A[0] * a)) * (1 - k) + (1 - B[1] + B[1] * Math.cos(B[0] * a)) * k);
      s += (j ? 'L' : 'M') + (r * Math.cos(a)).toFixed(1) + ' ' + (r * Math.sin(a)).toFixed(1);
    }
    return s + 'Z';
  }

  path.setAttribute('d', d(0));
  tile.addEventListener('click', () => {
    setH(HUES[(HUES.indexOf(hue) + 1) % HUES.length]);
    tile.classList.remove('pop');
    void tile.offsetWidth;
    tile.classList.add('pop');
  });

  if (reduce) return;

  let tx = 0, ty = 0, cx = 0, cy = 0;
  addEventListener('pointermove', e => {
    tx = (e.clientX / innerWidth - 0.5) * 20;
    ty = (e.clientY / innerHeight - 0.5) * 20;
  }, { passive: true });

  const t0 = performance.now();
  (function loop(n) {
    const t = (n - t0) / 1000;
    path.setAttribute('d', d(t));
    path.setAttribute('transform', `rotate(${(t * 8).toFixed(2)})`);
    cx += (tx - cx) * 0.08;
    cy += (ty - cy) * 0.08;
    svg.style.transform = `translate(${cx.toFixed(2)}px,${cy.toFixed(2)}px)`;
    gl.style.transform = `translate(${(cx * 1.6).toFixed(2)}px,${(cy * 1.6).toFixed(2)}px)`;
    requestAnimationFrame(loop);
  })(t0);
})();

/* price counter */
(() => {
  const amt = $('#amt');
  new IntersectionObserver((es, o) => {
    if (!es[0].isIntersecting) return;
    o.disconnect();
    if (reduce) return;
    const t0 = performance.now();
    (function f(n) {
      let k = Math.min(1, (n - t0) / 1000);
      k = 1 - Math.pow(1 - k, 3);
      amt.textContent = '$' + Math.round(10 * k);
      if (k < 1) requestAnimationFrame(f);
    })(t0);
  }, { threshold: 0.4 }).observe(amt);
})();
